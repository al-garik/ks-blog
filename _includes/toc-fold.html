<script>
(function () {
  // ks-blog TOC behavior (brand restyle), two clean mechanisms:
  // 1. Desktop sidebar: archive rows (year/month) toggle their nested list on click.
  // 2. Narrow screens (<992px, where Quarto display:none's the margin sidebar): build a
  //    CLONE of the toc list as a <details class="mobile-toc"> inserted right after the
  //    post title block. Cloning (not moving) leaves the original sidebar DOM untouched, so
  //    scrollspy/desktop styles keep working; the clone drops role="doc-toc" because the
  //    vendor rule `nav[role=doc-toc]{display:none}` (mobile media) would hide it.
  //    IDs are stripped from the clone (no duplicate ids); anchor hrefs stay valid.
  var NARROW = '(max-width: 991.98px)';

  function wireToc(toc) {
    if (!toc || toc.dataset.ksWired) return;
    toc.dataset.ksWired = '1';
    toc.addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (!a) return;
      var li = a.parentElement;
      if (li && li.querySelector(':scope > ul')) li.classList.toggle('toc-open');
    });
  }

  function stripIds(node) {
    if (node.removeAttribute) node.removeAttribute('id');
    node.querySelectorAll && node.querySelectorAll('[id]').forEach(function (n) { n.removeAttribute('id'); });
  }

  function buildMobileToc() {
    if (!window.matchMedia(NARROW).matches) return;
    if (document.querySelector('.mobile-toc')) return;
    var src = document.querySelector('#quarto-margin-sidebar #TOC > ul');
    var main = document.querySelector('#quarto-document-content');
    if (!src || !main) return;
    var det = document.createElement('details');
    det.className = 'mobile-toc';
    var sum = document.createElement('summary');
    var t = document.querySelector('#quarto-margin-sidebar #toc-title');
    sum.textContent = t ? t.textContent.trim() : 'On this page';
    var nav = document.createElement('nav');
    nav.setAttribute('aria-label', 'Table of contents');
    var clone = src.cloneNode(true);
    stripIds(clone);
    // the source list is a bootstrap .collapse wrapper (hidden by CSS unless .show);
    // the clone is our own <details> accordion — drop collapse state from every list level
    clone.classList.remove('collapse', 'collapsing', 'show');
    clone.querySelectorAll('ul.collapse, ul.collapsing').forEach(function (u) {
      u.classList.remove('collapse', 'collapsing');
    });
    nav.appendChild(clone);
    det.appendChild(sum);
    det.appendChild(nav);
    var hdr = main.querySelector('#title-block-header') || main.querySelector('.quarto-title');
    if (hdr) hdr.insertAdjacentElement('afterend', det);
    else main.insertBefore(det, main.firstChild);
    // archive rows in the clone toggle months, and a picked section closes the accordion
    clone.addEventListener('click', function (e) {
      var a = e.target.closest('a');
      if (!a) return;
      var li = a.parentElement;
      if (li && li.querySelector(':scope > ul')) li.classList.toggle('toc-open');
      if (e.target.tagName !== 'A' || !e.target.getAttribute('href') || e.target.getAttribute('href').length < 2) return;
      det.open = false;
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
    wireToc(document.querySelector('#quarto-margin-sidebar #TOC'));
    buildMobileToc();
  });
  window.addEventListener('resize', function () {
    if (window.matchMedia(NARROW).matches) buildMobileToc();
  });
})();
</script>

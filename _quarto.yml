project:
  type: website
  output-dir: docs
  resources:
    - "posts/**/*.png"
    - "posts/**/*.jpg"
    - "posts/**/*.docx"
    - "images/**/*"
    - "fonts/**/*"

website:
  title: "KeyStat Technical Blog"
  description: "Articles about R programming, clinical data processing and analysis, and statistical reporting"
  site-url: "https://al-garik.github.io/ks-blog/"
  favicon: "images/favicon/favicon.png"
  
  navbar:
    background: primary
    foreground: light
    title: "Technical Blog"
    search: true
    logo: "images/brand/logo-navbar-en.svg"
    logo-alt: "KeyStat"    
    logo-href: "https://keystatsolutions.com"    
    left:
      - href: index.qmd
        text: Home
    right:
      - icon: github
        href: "https://al-garik.github.io/ks-blog/"
      - icon: rss
        href: index.xml
  page-footer:
    background: dark
    left: |
      &nbsp;
    center: |
      Powered by [Quarto](https://quarto.org/)
    right: |
      Made by KeyStat for the R community

      © 2026 KeyStat. All rights reserved.

format:
  html:
    theme: 
      - cosmo
      - style.scss
    toc: true
    toc-depth: 2
    code-fold: false
    code-tools: false
    lightbox: true
    include-in-header:
      - _includes/navbar-fix.html
      - _includes/toc-fold.html
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 300px

# Enable RSS feed generation
metadata-files:
  - _metadata.yml